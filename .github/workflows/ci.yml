name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  telemetry-ingest:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/telemetry-ingest } }
    services:
      timescaledb:
        # Google's Docker Hub mirror: same image, no anonymous pull rate limit.
        image: mirror.gcr.io/timescale/timescaledb:2.17.2-pg16
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: ci }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ci" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: services/telemetry-ingest/go.mod, cache-dependency-path: services/telemetry-ingest/go.sum }
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: test (incl. Postgres/TimescaleDB contract)
        run: go test -race ./...
        env: { TEST_DATABASE_URL: "postgres://ci:ci@localhost:5432/ci" }

  uplift-sim:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sim/uplift-sim } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: sim/uplift-sim }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  mission-control:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/mission-control } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: services/mission-control/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  site-dashboard:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/site-dashboard } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/site-dashboard/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  terraform:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infra/terraform } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.9.8 }
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  images:
    needs: [telemetry-ingest, uplift-sim, mission-control, site-dashboard]
    runs-on: ubuntu-latest
    strategy:
      # Report every image independently; one broken Dockerfile shouldn't hide another.
      fail-fast: false
      matrix:
        svc:
          - { name: telemetry-ingest, path: services/telemetry-ingest }
          - { name: mission-control, path: services/mission-control }
          - { name: site-dashboard, path: apps/site-dashboard }
          - { name: uplift-sim, path: sim/uplift-sim }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # ECS tasks run on Graviton (arm64); build both so laptops can run them too.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.svc.path }}
          platforms: linux/amd64,linux/arm64
          push: false
          tags: fleet/${{ matrix.svc.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.svc.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.svc.name }}
